<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .login-container{
            width:350px;
            background:#fff;
            padding:40px;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .login-container h1{
            text-align:center;
            margin-bottom:25px;
            color:#0f172a;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#334155;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            outline:none;
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#2563eb;
            box-shadow:0 0 5px rgba(37,99,235,0.4);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .error{
            background:#fee2e2;
            color:#b91c1c;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }

        .success{
            background:#dcfce7;
            color:#166534;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h1>Login</h1>

    <!-- Mensagem de erro -->
    <div th:if="${param.error}" class="error">
        Usuário ou senha inválidos
    </div>

    <!-- Logout -->
    <div th:if="${param.logout}" class="success">
        Logout realizado com sucesso
    </div>

    <!-- Form Login Spring Security -->
    <form th:action="@{/login}" method="post">

        <div class="input-group">
            <label>Email</label>
            <input type="text" name="username" placeholder="Digite seu usuário" required>
        </div>

        <div class="input-group">
            <label>Senha<t/label>
            <input type="password" name="password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
